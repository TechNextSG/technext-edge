name: CI

# Playbook requires this for the Edge repo: typecheck + vitest on every push.
# It exists because a stray brace in dates.ts broke 5 of 10 test files and
# nothing caught it — the tree was only verified by hand.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # package boundaries, then typecheck + vitest in every workspace
      # (contracts, ai, quotation, bff) — see "Layout" in README.md
      - run: npm run verify
