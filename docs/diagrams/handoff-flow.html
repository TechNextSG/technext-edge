  function outPort(n, i) {
    var c = (n.outs && n.outs.length) || 1;
    var gap = c === 1 ? 0 : (c === 2 ? 34 : 26);
    return { x: n.x + W, y: n.y + H / 2 + (i - (c - 1) / 2) * gap };
  }
  function inPort(n) { return { x: n.x, y: n.y + H / 2 }; }
  function bez(a, b) {
    var dx = Math.max(60, Math.abs(b.x - a.x) * 0.5);
    if (b.x < a.x + 40) dx = 120;
    return 'M' + a.x + ',' + a.y + ' C' + (a.x + dx) + ',' + a.y + ' ' + (b.x - dx) + ',' + b.y + ' ' + b.x + ',' + b.y;
  }

  var gSticky = el('g', {}, world), gWire = el('g', {}, world), gLabel = el('g', {}, world), gNode = el('g', {}, world);

  STICKIES.forEach(function (s) {
    var g = el('g', { 'class': 'sticky' }, gSticky);
    el('rect', { x: s.x, y: s.y, width: s.w, height: s.h, rx: 8 }, g);
    var t = el('text', { x: s.x + 14 + (s.dx || 0), y: s.y + 24, 'class': 'st-title' }, g); t.textContent = s.title;
    s.body.forEach(function (line, i) {
      var b = el('text', { x: s.x + 14 + (s.dx || 0), y: s.y + 44 + i * 16, 'class': 'st-body' }, g); b.textContent = line;
    });
  });

  var wires = [];
  EDGES.forEach(function (e) {
    var a = byId[e[0]], b = byId[e[2]];
    var isSwap = e[4] === 'swap';
    var p = isSwap ? { x: a.x + W / 2, y: a.y + H } : outPort(a, e[1]);
    var q = isSwap ? { x: b.x + W / 2, y: b.y } : inPort(b);
    var d = isSwap
      ? 'M' + p.x + ',' + p.y + ' C' + p.x + ',' + (p.y + 120) + ' ' + q.x + ',' + (q.y - 120) + ' ' + q.x + ',' + q.y
      : bez(p, q);
    var path = el('path', { d: d, 'class': 'wire' + (e[4] === 'err' ? ' err' : '') + (isSwap ? ' swap' : '') }, gWire);
    var rec = { from: e[0], to: e[2], path: path, label: null };
    if (e[3]) {
      var lg = el('g', { 'class': 'wlabel' }, gLabel);
      var mx = (p.x + q.x) / 2, my = isSwap ? q.y - 130 : (p.y + q.y) / 2;
      var tw = e[3].length * 6.2 + 10;
      el('rect', { x: mx - tw / 2, y: my - 9, width: tw, height: 18, rx: 4 }, lg);
      var tx = el('text', { x: mx, y: my + 4, 'text-anchor': 'middle' }, lg); tx.textContent = e[3];
      rec.label = lg;
    }
    wires.push(rec);
  });
  AI_WIRES.forEach(function (w) {
    var a = byId[w[0]], b = byId[w[1]];
    var p = { x: a.x + W / 2, y: a.y + H }, q = { x: b.x + W / 2, y: b.y };
    var d = 'M' + p.x + ',' + p.y + ' C' + p.x + ',' + (p.y + 70) + ' ' + q.x + ',' + (q.y - 70) + ' ' + q.x + ',' + q.y;
    wires.push({ from: w[0], to: w[1], path: el('path', { d: d, 'class': 'wire ai' }, gWire), label: null });
  });

  NODES.forEach(function (n) {
    var g = el('g', { 'class': 'node' + (n.status === 'proposed' || n.status === 'phase3' ? ' proposed' : ''), 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': n.name + (n.status ? ' (' + n.status + ')' : '') }, gNode);
    if (n.kind === 'trigger') {
      el('rect', { 'class': 'box', x: n.x, y: n.y, width: W, height: H, rx: 12 }, g);
      el('path', { d: 'M' + (n.x + 50) + ',' + n.y + ' A50,50 0 0 0 ' + (n.x + 50) + ',' + (n.y + H), fill: 'none' }, g);
    } else if (n.kind === 'model') {
      el('rect', { 'class': 'box', x: n.x + 10, y: n.y, width: W - 20, height: W - 20, rx: 40 }, g);
    } else {
      el('rect', { 'class': 'box', x: n.x, y: n.y, width: W, height: H, rx: 8 }, g);
    }
    if (n.kind === 'trigger') g.querySelector('rect').setAttribute('rx', 12);
    var cy = n.kind === 'model' ? n.y + 40 : n.y + H / 2;
    var ig = el('g', { transform: 'translate(' + (n.x + W / 2 - 18) + ',' + (cy - 18) + ') scale(1.5)', fill: 'none',
      stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    ig.style.color = 'var(' + COLOR[n.kind] + ')';
    ig.innerHTML = ICON[n.icon];
    if (n.kind !== 'trigger' && n.kind !== 'model') el('circle', { 'class': 'port', cx: n.x, cy: n.y + H / 2, r: 5 }, g);
    if (n.kind !== 'model') {
      var c = (n.outs && n.outs.length) || 1;
      if (!(n.kind === 'stop' || (n.kind === 'respond'))) {
        for (var i = 0; i < c; i++) {
          var op = outPort(n, i);
          el('circle', { 'class': 'port', cx: op.x, cy: op.y, r: 5 }, g);
          if (c > 1) { var pl = el('text', { 'class': 'plabel', x: op.x + 9, y: op.y - 6 }, g); pl.textContent = n.outs[i]; }
        }
      }
    }
    if (n.ai) {
      el('rect', { 'class': 'port ai', x: n.x + W / 2 - 5, y: n.y + H - 5, width: 10, height: 10, transform: 'rotate(45 ' + (n.x + W / 2) + ' ' + (n.y + H) + ')' }, g);
    }
    if (n.kind === 'model') {
      el('rect', { 'class': 'port ai', x: n.x + W / 2 - 5, y: n.y - 5, width: 10, height: 10, transform: 'rotate(45 ' + (n.x + W / 2) + ' ' + n.y + ')' }, g);
    }
    var ny = n.kind === 'model' ? n.y + W - 20 + 20 : n.y + H + 20;
    var t1 = el('text', { 'class': 'name', x: n.x + W / 2, y: ny, 'text-anchor': 'middle' }, g); t1.textContent = n.name;
    var t2 = el('text', { 'class': 'sub', x: n.x + W / 2, y: ny + 16, 'text-anchor': 'middle' }, g); t2.textContent = n.sub;
    if (n.status) { var st = el('text', { 'class': 'status ' + n.status, x: n.kind === 'model' ? n.x + W / 2 : n.x, y: n.kind === 'model' ? n.y + 132 : n.y - 8, 'text-anchor': n.kind === 'model' ? 'middle' : 'start' }, g); st.textContent = n.status === 'phase3' ? 'phase 3' : n.status; }
    g.addEventListener('click', function (ev) { ev.stopPropagation(); select(n.id); });
    g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id); } });
    g.addEventListener('mouseenter', function () { highlight(n.id); });
    g.addEventListener('mouseleave', function () { highlight(selected); });
  });

  // ---------------- Highlight + detail panel ----------------
  var selected = null;
  function highlight(id) {
    var nodes = gNode.querySelectorAll('.node');
    if (!id) {
      nodes.forEach(function (g) { g.classList.remove('dim', 'sel'); });
      wires.forEach(function (w) { w.path.classList.remove('dim', 'hot'); if (w.label) w.label.classList.remove('dim'); });
      return;
    }
    var keep = {}; keep[id] = true;
    wires.forEach(function (w) {
      var on = w.from === id || w.to === id;
      if (on) { keep[w.from] = true; keep[w.to] = true; }
      w.path.classList.toggle('hot', on); w.path.classList.toggle('dim', !on);
      if (w.label) w.label.classList.toggle('dim', !on);
    });
    nodes.forEach(function (g) {
      var nid = g.getAttribute('data-id');
      g.classList.toggle('dim', !keep[nid]); g.classList.toggle('sel', nid === selected);
    });
  }
  var panel = document.getElementById('panel'), body = document.getElementById('panelBody');
  function select(id) {
    selected = id;
    var n = byId[id];
    body.innerHTML = '<h2>' + n.name + (n.status ? '<span class="badge ' + n.status + '">' + (n.status === 'phase3' ? 'phase 3' : n.status) + '</span>' : '') + '</h2><div class="kind">' + n.type + '</div><dl>' +
      '<dt>What happens</dt><dd>' + n.what + '</dd>' +
      '<dt>Code</dt><dd><code>' + n.file + '</code></dd></dl>';
    panel.classList.add('open');
    highlight(id);
  }
  function closePanel() { selected = null; panel.classList.remove('open'); highlight(null); }
  panel.querySelector('.close').addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  // ---------------- Pan / zoom ----------------
  var svg = document.getElementById('svg'), stage = document.getElementById('stage');
  var view = { x: 0, y: 0, k: 1 };
  function apply() {
    world.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
    stage.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
    stage.style.backgroundSize = (20 * view.k) + 'px ' + (20 * view.k) + 'px';
  }
  function fit() {
    var bb = world.getBBox(), r = svg.getBoundingClientRect(), pad = 40, top = 56;
    var k = Math.min((r.width - pad * 2) / bb.width, (r.height - top - pad) / bb.height, 1.2);
    view.k = k;
    view.x = (r.width - bb.width * k) / 2 - bb.x * k;
    view.y = top + (r.height - top - bb.height * k) / 2 - bb.y * k;
    apply();
  }
  function zoomAt(f, cx, cy) {
    var nk = Math.max(0.15, Math.min(2.5, view.k * f));
    view.x = cx - (cx - view.x) * (nk / view.k);
    view.y = cy - (cy - view.y) * (nk / view.k);
    view.k = nk; apply();
  }
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = svg.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  var drag = null;
  svg.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.node')) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
    stage.classList.add('dragging'); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
  });
  svg.addEventListener('pointerup', function () {
    if (drag && !drag.moved) closePanel();
    drag = null; stage.classList.remove('dragging');
  });
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('zin').addEventListener('click', function () { var r = svg.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); });
  document.getElementById('zout').addEventListener('click', function () { var r = svg.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
  // Open readable from the trigger, like n8n after a small zoom-in; the fit button shows everything.
  function start() {
    fit();
    if (view.k >= 0.6) return;
    var bb = world.getBBox(), r = svg.getBoundingClientRect();
    view.k = 0.6;
    view.x = 24 - bb.x * view.k;
    view.y = 56 + Math.max(0, (r.height - 56 - bb.height * view.k) / 2) - bb.y * view.k;
    apply();
  }
  start();
})();
</script>
</body>
</html>
