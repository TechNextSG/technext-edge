  .sticky .st-body { font-size: 11.5px; fill: var(--sticky-text); }
  .toolbar { position: absolute; left: 16px; bottom: 16px; z-index: 5; display: flex; gap: 6px; }

  #panel { position: absolute; top: 56px; right: 16px; width: 340px; max-height: calc(100% - 80px); overflow: auto;

  @media (max-width: 640px) { #panel { left: 16px; width: auto; } header .src, .hint { display: none; } }

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var W = 100, H = 100;

  // Icons are 24x24 line glyphs drawn at the centre of each node.
  var ICON = {
    webhook: '<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="none"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
    split: '<path d="M4 12h6"/><path d="M10 12c3 0 4-6 8-6"/><path d="M10 12c3 0 4 6 8 6"/><path d="M16 4l2 2-2 2M16 16l2 2-2 2"/>',
    code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 6l-2 12"/>',
    db: '<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
    loop: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    ai: '<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4"/><circle cx="9" cy="13" r="1.4" fill="currentColor"/><circle cx="15" cy="13" r="1.4" fill="currentColor"/>',
    model: '<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>',
    wa: '<path d="M21 12a9 9 0 0 1-13.6 7.7L3 21l1.4-4.3A9 9 0 1 1 21 12z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/>',
    stop: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
    respond: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/>',
    alert: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    pause: '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    quiet: '<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>'
  };

  // kind -> icon colour. "trigger" also gets the rounded left edge n8n uses for triggers.
  var COLOR = { trigger: '--c-trigger', if: '--c-if', code: '--c-code', kv: '--c-kv', ai: '--c-ai',
    model: '--c-model', wa: '--c-wa', stop: '--c-stop', respond: '--c-respond' };

  // ---------------- Nodes (x, y = top-left on the canvas) ----------------
  // outs: output ports, top to bottom; a label is drawn beside a port when there is more than one.
  var NODES = [
    { id: 'hook', x: 0, y: 200, kind: 'trigger', icon: 'webhook', name: 'WhatsApp Webhook', sub: 'POST · Meta',
      type: 'Webhook trigger', file: 'bff/src/routes/whatsapp.ts',
      what: 'Meta calls <code>POST /v1/channels/whatsapp/webhook</code>. One call can carry several messages. (A <code>GET</code> on the same path answers the subscription handshake with <code>hub.challenge</code>.)' },
    { id: 'sig', x: 200, y: 200, kind: 'if', icon: 'shield', name: 'Signature valid?', sub: 'x-hub-signature-256', outs: ['true', 'false'],
      type: 'IF', file: 'channels/whatsapp/meta.ts · verifySignature',
      what: 'HMAC-SHA256 of the raw body with <code>WHATSAPP_APP_SECRET</code>. No secret configured → 500; bad signature → 401; body that is not JSON → 400.' },
    { id: 'parse', x: 400, y: 200, kind: 'code', icon: 'code', name: 'Parse text messages', sub: 'parseInboundTexts',
      type: 'Code', file: 'channels/whatsapp/meta.ts',
      what: 'Keeps only <b>text</b> messages. Images, voice notes and stickers are dropped here, so the bot does not answer them.' },
    { id: 'any', x: 600, y: 200, kind: 'if', icon: 'split', name: 'Any text?', sub: 'inbound.length > 0', outs: ['true', 'false'],
      type: 'IF', file: 'bff/src/routes/whatsapp.ts', what: 'Nothing to read → answer Meta at once with zeros.' },
    { id: 'claim', x: 800, y: 200, kind: 'if', icon: 'loop', name: 'Claim each message', sub: 'claimMessage(id)', outs: ['new', 'seen'],
      type: 'Loop + IF', file: 'store/conversationStore.ts',
      what: 'One claim per Meta message id, with a fence token, so a retried webhook is not answered twice. Already claimed → counted as a duplicate.' },
    { id: 'group', x: 1000, y: 200, kind: 'code', icon: 'code', name: 'Group by phone', sub: 'one batch per guest',
      type: 'Code', file: 'bff/src/routes/whatsapp.ts',
      what: 'All new messages from one phone become one turn; their texts are joined with newlines.' },
    { id: 'lock', x: 1200, y: 200, kind: 'kv', icon: 'lock', name: 'Phone lock', sub: '20 s deadline',
      type: 'Lock', file: 'channels/whatsapp/turn.ts · processPhoneTurnBatch',
      what: '<code>store.withPhoneLock</code>: one turn per phone at a time. The whole turn races <code>WHATSAPP_TURN_TIMEOUT_MS</code> (default 20 000 ms); losing the race goes to the error path.' },
    { id: 'reset', x: 1400, y: 200, kind: 'if', icon: 'split', name: 'Reset command?', sub: 'isResetCommand', outs: ['true', 'false'],
      type: 'IF', file: 'channels/whatsapp/turn.ts',
      what: '"reset", "start over", "restart", 重置, 重新开始 (the whole message, nothing else).' },
    { id: 'append', x: 1600, y: 200, kind: 'kv', icon: 'db', name: 'Append guest turn', sub: 'history + language',
      type: 'Redis', file: 'store/conversationStore.ts',
      what: 'Adds the batch to the thread, reads the whole history, and the guest language from the guest turns only.' },
    { id: 'gate', x: 1800, y: 200, kind: 'if', icon: 'split', name: 'Gate', sub: 'paused · intent · human', outs: ['go on', 'hand off', 'stay quiet'],
      type: 'Switch', file: 'channels/whatsapp/turn.ts · ai intent.ts',
      what: '<b>hand off</b>: thread already parked, guest asked for a person (<code>wantsHuman</code>), complaint or cancellation, or not a booking (<code>classifyEnquiry</code>).<br><b>stay quiet</b>: parked and the guest was told less than 10 minutes ago (<code>needsTelling</code>).<br>A thread parked as <code>partner_self_serve</code> is resumed and goes on.' },
    { id: 'extract', x: 2200, y: 200, kind: 'ai', icon: 'ai', name: 'Extract trip', sub: '4 reads in parallel', ai: true,
      type: 'AI · extract()', file: 'ai/src/application/extract.ts',
      what: 'Main read of the whole transcript into a JSON-schema Trip (zod-checked, one corrective retry), plus three side reads in parallel: <code>extractGuests</code>, <code>extractCheckIn</code>, <code>extractDiveWindow</code>. Side reads only fill a gap. Then: verbatim-evidence rule, Manila "today" date resolver; a past, reversed or ambiguous date becomes a question.' },
    { id: 'precheck', x: 2400, y: 200, kind: 'code', icon: 'code', name: 'Build trip + precheck', sub: 'buildBffTrip',
      type: 'Code', file: 'ai/src/application/odooHandoff.ts',
      what: 'Team-estimator Trip shape, rooms split by capacity, precheck issue codes. <code>done</code> = nothing left to ask <i>and</i> no precheck issue.' },
    { id: 'reply', x: 2600, y: 200, kind: 'ai', icon: 'ai', name: 'Write reply', sub: 'fact gate', ai: true,
      type: 'AI · synthesis', file: 'ai/src/application/synthesis.ts',
      what: '<code>generateText</code> within the time left (at least 1.5 s). <code>verifyGuestFacingText</code> must pass: no price, no false confirmation, counts, dates and room type match the trip. Out of time, an error, or a refusal → the deterministic text from <code>questions.ts</code> is used.' },
    { id: 'stall', x: 2800, y: 200, kind: 'if', icon: 'split', name: 'Stalled?', sub: 'STALL_LIMIT · ASK_LIMIT', outs: ['false', 'true'],
      type: 'IF', file: 'channels/whatsapp/turn.ts',
      what: 'Same fields still open after <code>STALL_LIMIT</code> turns, or the bot has replied <code>ASK_LIMIT</code> times.' },
    { id: 'partner', x: 3000, y: 200, kind: 'if', icon: 'split', name: 'Agent / instructor?', sub: 'guestType', outs: ['false', 'true'],
      type: 'IF', file: 'channels/whatsapp/turn.ts',
      what: 'A finished enquiry from an agent or instructor (who has not said "not an agency") gets the sign-in link to the team estimator instead of a draft. Without an app URL configured, it falls through as a normal enquiry and logs a warning.' },
    { id: 'done', x: 3200, y: 200, kind: 'if', icon: 'split', name: 'Enquiry done?', sub: 'quotationDraft', outs: ['true', 'false'],
      type: 'IF', file: 'bff/src/quote/application/converseWithQuotation.ts',
      what: 'A draft exists only when <code>done</code> and <code>ENABLE_HONO_QUOTATION_TOOL=true</code> (set on production).' },
    { id: 'save', x: 3400, y: 200, kind: 'kv', icon: 'db', name: 'Save draft quotation', sub: 'QT-… pending review',
      type: 'Redis', file: 'store/quotationStore.ts · saveQuotationDraft',
      what: 'Merged with the phone’s open quotation: a staff correction is kept unless the guest restated it; if priced facts moved, price and approval are dropped and an alert is added. The reply gains "our reservations team is preparing your quotation".' },
    { id: 'send', x: 3600, y: 200, kind: 'wa', icon: 'wa', name: 'Send reply', sub: 'Graph API',
      type: 'WhatsApp · send', file: 'channels/whatsapp/meta.ts',
      what: 'Appends the assistant turn, then sends. Changed numbers are named back to the guest. Never a price.' },
    { id: 'mark', x: 3800, y: 200, kind: 'kv', icon: 'check', name: 'Mark done', sub: 'per message',
      type: 'Redis', file: 'store/conversationStore.ts', what: 'Every claimed message of the batch is marked done with its fence token.' },
    { id: 'respond', x: 4000, y: 200, kind: 'respond', icon: 'respond', name: 'Respond to Meta', sub: '200 · counts',
      type: 'Respond to webhook', file: 'bff/src/routes/whatsapp.ts',
      what: '<code>{received, replied, duplicates, failed, handoffs}</code>.' },

    // branches
    { id: 'e401', x: 400, y: 400, kind: 'stop', icon: 'stop', name: 'Reject', sub: '401 invalid_signature',
      type: 'Stop', file: 'bff/src/routes/whatsapp.ts', what: 'Nothing is parsed or stored.' },
    { id: 'zero', x: 800, y: 400, kind: 'respond', icon: 'respond', name: 'Respond zeros', sub: '200 · received 0',
      type: 'Respond to webhook', file: 'bff/src/routes/whatsapp.ts', what: 'For a status update or a media-only message.' },
    { id: 'dup', x: 1000, y: 400, kind: 'code', icon: 'code', name: 'Count duplicate', sub: 'skip',
      type: 'Code', file: 'bff/src/routes/whatsapp.ts', what: 'A message id already claimed is counted and not processed again.' },
    { id: 'rclear', x: 1600, y: 400, kind: 'kv', icon: 'db', name: 'Close quote + clear', sub: 'cancel open draft',
      type: 'Redis', file: 'channels/whatsapp/turn.ts · closeEnquiryQuotation',
      what: 'The open quotation is cancelled with a staff alert; the thread is cleared.' },
    { id: 'rsend', x: 1800, y: 400, kind: 'wa', icon: 'wa', name: 'Send reset reply', sub: 'RESET_REPLY',
      type: 'WhatsApp · send', file: 'channels/whatsapp/turn.ts', what: 'Fixed welcome text in English or Chinese.' },
    { id: 'park', x: 2000, y: 400, kind: 'wa', icon: 'pause', name: 'Park + hand-off reply', sub: '→ /handoff',
      type: 'WhatsApp · send', file: 'channels/whatsapp/turn.ts',
      what: 'Thread paused with its reason (guest_asked_for_human, complaint_or_cancel, not_booking, or the earlier reason), fixed reply sent, <code>markTold</code>.' },
    { id: 'quiet', x: 2000, y: 560, kind: 'code', icon: 'quiet', name: 'Stay quiet', sub: 'told < 10 min ago',
      type: 'No operation', file: 'channels/whatsapp/turn.ts · HOLD_REPEAT_MS', what: 'Nothing is sent; the messages are marked done.' },
    { id: 'model', x: 2400, y: 440, kind: 'model', icon: 'model', name: 'Chat model', sub: 'Gemini / DeepSeek',
      type: 'Model (sub-node)', file: 'ai/src/infra/providers/providerFromEnv.ts',
      what: 'Flexible model: primary + fallback chosen in <code>/admin/ai</code> (env as backstop), with a circuit breaker held per process. Not a fixed vendor.' },
    { id: 'spark', x: 3000, y: 400, kind: 'wa', icon: 'pause', name: 'Park · stalled', sub: 'missing fields listed',
      type: 'WhatsApp · send', file: 'channels/whatsapp/turn.ts', what: 'Paused as <code>stalled</code> or <code>asking_limit</code>; the reply lists the missing fields.' },
    { id: 'invite', x: 3200, y: 400, kind: 'wa', icon: 'pause', name: 'Sign-in invite', sub: 'partner_self_serve',
      type: 'WhatsApp · send', file: 'channels/whatsapp/turn.ts', what: 'Link to <code>/signin</code> on the team estimator; the thread is parked until the guest writes again.' },

    // error path
    { id: 'err', x: 1200, y: 820, kind: 'trigger', icon: 'alert', name: 'On error', sub: 'or 20 s timeout',
      type: 'Error trigger', file: 'channels/whatsapp/turn.ts (catch)', what: 'Anything thrown in the turn, or the deadline winning the race.' },
    { id: 'sent', x: 1400, y: 820, kind: 'if', icon: 'split', name: 'Already sending?', sub: 'sending flag', outs: ['false', 'true'],
      type: 'IF', file: 'channels/whatsapp/turn.ts', what: 'Once a send has started, no apology is added.' },
    { id: 'sorry', x: 1600, y: 820, kind: 'wa', icon: 'pause', name: 'Apology + park', sub: 'turn_failed',
      type: 'WhatsApp · send', file: 'channels/whatsapp/turn.ts', what: 'Fixed apology, thread parked as <code>turn_failed</code> for staff.' },
    { id: 'release', x: 1800, y: 820, kind: 'stop', icon: 'loop', name: 'Release claims', sub: 'Meta retries',
      type: 'Redis', file: 'channels/whatsapp/turn.ts · releaseAll',
      what: 'Only when the apology itself could not be sent: the claims are released so Meta’s retry is processed again.' },
    { id: 'mark2', x: 1800, y: 980, kind: 'kv', icon: 'check', name: 'Mark done', sub: 'failed += 1',
      type: 'Redis', file: 'channels/whatsapp/turn.ts', what: 'Counted as failed in the webhook answer.' }
  ];

  // [from, outputIndex, to, label?, style?]  style: 'ai' for model wires, 'err' for the error path.
  var EDGES = [
    ['hook', 0, 'sig'],
    ['sig', 0, 'parse'], ['sig', 1, 'e401'],
    ['parse', 0, 'any'],
    ['any', 0, 'claim'], ['any', 1, 'zero'],
    ['claim', 0, 'group'], ['claim', 1, 'dup'],
    ['group', 0, 'lock'],
    ['lock', 0, 'reset'],
    ['reset', 1, 'append'], ['reset', 0, 'rclear'],
    ['rclear', 0, 'rsend'],
    ['append', 0, 'gate'],
    ['gate', 0, 'extract'], ['gate', 1, 'park'], ['gate', 2, 'quiet'],
    ['extract', 0, 'precheck'],
    ['precheck', 0, 'reply'],
    ['reply', 0, 'stall'],
    ['stall', 0, 'partner'], ['stall', 1, 'spark'],
    ['partner', 0, 'done'], ['partner', 1, 'invite'],
    ['done', 0, 'save'], ['done', 1, 'send', 'still asking'],
    ['save', 0, 'send'],
    ['send', 0, 'mark'],
    ['mark', 0, 'respond'],
    ['err', 0, 'sent', null, 'err'], ['sent', 0, 'sorry', null, 'err'], ['sent', 1, 'mark2', null, 'err'],
    ['sorry', 0, 'release', 'send failed', 'err'], ['sorry', 0, 'mark2', null, 'err']
  ];
  // Sub-node wires (model below the two AI steps), n8n draws these dashed from the node's bottom.
  var AI_WIRES = [['extract', 'model'], ['reply', 'model']];

  var STICKIES = [
    { x: -30, y: 90, w: 1150, h: 450, title: 'Receive', body: ['Signature, text only, one claim per message id,', 'then one batch per phone.'] },
    { x: 1170, y: 90, w: 960, h: 610, title: 'Lock + gate — no model call', body: ['Reset, parked threads, complaints and', '"talk to a person" are answered with fixed text.'] },
    { x: 2170, y: 90, w: 540, h: 590, title: 'converse() — ai/', body: ['Up to 6 model calls: 4 reads (+1 retry)', 'and 1 reply. The model is a setting.'] },
    { x: 2770, y: 90, w: 1370, h: 450, title: 'Answer', body: ['The guest is never given a price. A finished enquiry', 'becomes a draft for staff to price and approve.'] },
    { x: 1170, y: 730, w: 760, h: 410, title: 'On error', body: ['No send started → apology and park.', 'Apology failed too → release claims for Meta.'] }
  ];

  // ---------------- Render ----------------
  var world = document.getElementById('world');
  var byId = {};
  NODES.forEach(function (n) { byId[n.id] = n; });

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function outPort(n, i) {
    var c = (n.outs && n.outs.length) || 1;
    var gap = c === 1 ? 0 : (c === 2 ? 34 : 26);
    return { x: n.x + W, y: n.y + H / 2 + (i - (c - 1) / 2) * gap };
  }
  function inPort(n) { return { x: n.x, y: n.y + H / 2 }; }
  function bez(a, b) {
    var dx = Math.max(60, Math.abs(b.x - a.x) * 0.5);
    if (b.x < a.x + 40) dx = 120;
    return 'M' + a.x + ',' + a.y + ' C' + (a.x + dx) + ',' + a.y + ' ' + (b.x - dx) + ',' + b.y + ' ' + b.x + ',' + b.y;
  }

  var gSticky = el('g', {}, world), gWire = el('g', {}, world), gLabel = el('g', {}, world), gNode = el('g', {}, world);

  STICKIES.forEach(function (s) {
    var g = el('g', { 'class': 'sticky' }, gSticky);
    el('rect', { x: s.x, y: s.y, width: s.w, height: s.h, rx: 8 }, g);
    var t = el('text', { x: s.x + 14, y: s.y + 24, 'class': 'st-title' }, g); t.textContent = s.title;
    s.body.forEach(function (line, i) {
      var b = el('text', { x: s.x + 14, y: s.y + 44 + i * 16, 'class': 'st-body' }, g); b.textContent = line;
    });
  });

  var wires = [];
  EDGES.forEach(function (e) {
    var a = byId[e[0]], b = byId[e[2]];
    var p = outPort(a, e[1]), q = inPort(b);
    var path = el('path', { d: bez(p, q), 'class': 'wire' + (e[4] === 'err' ? ' err' : '') }, gWire);
    var rec = { from: e[0], to: e[2], path: path, label: null };
    if (e[3]) {
      var lg = el('g', { 'class': 'wlabel' }, gLabel);
      var mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      var tw = e[3].length * 6.2 + 10;
      el('rect', { x: mx - tw / 2, y: my - 9, width: tw, height: 18, rx: 4 }, lg);
      var tx = el('text', { x: mx, y: my + 4, 'text-anchor': 'middle' }, lg); tx.textContent = e[3];
      rec.label = lg;
    }
    wires.push(rec);
  });
  AI_WIRES.forEach(function (w) {
    var a = byId[w[0]], b = byId[w[1]];
    var p = { x: a.x + W / 2, y: a.y + H }, q = { x: b.x + W / 2, y: b.y };
    var d = 'M' + p.x + ',' + p.y + ' C' + p.x + ',' + (p.y + 70) + ' ' + q.x + ',' + (q.y - 70) + ' ' + q.x + ',' + q.y;
    wires.push({ from: w[0], to: w[1], path: el('path', { d: d, 'class': 'wire ai' }, gWire), label: null });
  });

  NODES.forEach(function (n) {
    var g = el('g', { 'class': 'node', 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': n.name }, gNode);
    if (n.kind === 'trigger') {
      el('rect', { 'class': 'box', x: n.x, y: n.y, width: W, height: H, rx: 12 }, g);
      el('path', { d: 'M' + (n.x + 50) + ',' + n.y + ' A50,50 0 0 0 ' + (n.x + 50) + ',' + (n.y + H), fill: 'none' }, g);
    } else if (n.kind === 'model') {
      el('rect', { 'class': 'box', x: n.x + 10, y: n.y, width: W - 20, height: W - 20, rx: 40 }, g);
    } else {
      el('rect', { 'class': 'box', x: n.x, y: n.y, width: W, height: H, rx: 8 }, g);
    }
    if (n.kind === 'trigger') g.querySelector('rect').setAttribute('rx', 12);
    var cy = n.kind === 'model' ? n.y + 40 : n.y + H / 2;
    var ig = el('g', { transform: 'translate(' + (n.x + W / 2 - 18) + ',' + (cy - 18) + ') scale(1.5)', fill: 'none',
      stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    ig.style.color = 'var(' + COLOR[n.kind] + ')';
    ig.innerHTML = ICON[n.icon];
    if (n.kind !== 'trigger' && n.kind !== 'model') el('circle', { 'class': 'port', cx: n.x, cy: n.y + H / 2, r: 5 }, g);
    if (n.kind !== 'model') {
      var c = (n.outs && n.outs.length) || 1;
      if (!(n.kind === 'stop' || (n.kind === 'respond'))) {
        for (var i = 0; i < c; i++) {
          var op = outPort(n, i);
          el('circle', { 'class': 'port', cx: op.x, cy: op.y, r: 5 }, g);
          if (c > 1) { var pl = el('text', { 'class': 'plabel', x: op.x + 9, y: op.y - 6 }, g); pl.textContent = n.outs[i]; }
        }
      }
    }
    if (n.ai) {
      el('rect', { 'class': 'port ai', x: n.x + W / 2 - 5, y: n.y + H - 5, width: 10, height: 10, transform: 'rotate(45 ' + (n.x + W / 2) + ' ' + (n.y + H) + ')' }, g);
    }
    if (n.kind === 'model') {
      el('rect', { 'class': 'port ai', x: n.x + W / 2 - 5, y: n.y - 5, width: 10, height: 10, transform: 'rotate(45 ' + (n.x + W / 2) + ' ' + n.y + ')' }, g);
    }
    var ny = n.kind === 'model' ? n.y + W - 20 + 20 : n.y + H + 20;
    var t1 = el('text', { 'class': 'name', x: n.x + W / 2, y: ny, 'text-anchor': 'middle' }, g); t1.textContent = n.name;
    var t2 = el('text', { 'class': 'sub', x: n.x + W / 2, y: ny + 16, 'text-anchor': 'middle' }, g); t2.textContent = n.sub;
    g.addEventListener('click', function (ev) { ev.stopPropagation(); select(n.id); });
    g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id); } });
    g.addEventListener('mouseenter', function () { highlight(n.id); });
    g.addEventListener('mouseleave', function () { highlight(selected); });
  });

  // ---------------- Highlight + detail panel ----------------
  var selected = null;
  function highlight(id) {
    var nodes = gNode.querySelectorAll('.node');
    if (!id) {
      nodes.forEach(function (g) { g.classList.remove('dim', 'sel'); });
      wires.forEach(function (w) { w.path.classList.remove('dim', 'hot'); if (w.label) w.label.classList.remove('dim'); });
      return;
    }
    var keep = {}; keep[id] = true;
    wires.forEach(function (w) {
      var on = w.from === id || w.to === id;
      if (on) { keep[w.from] = true; keep[w.to] = true; }
      w.path.classList.toggle('hot', on); w.path.classList.toggle('dim', !on);
      if (w.label) w.label.classList.toggle('dim', !on);
    });
    nodes.forEach(function (g) {
      var nid = g.getAttribute('data-id');
      g.classList.toggle('dim', !keep[nid]); g.classList.toggle('sel', nid === selected);
    });
  }
  var panel = document.getElementById('panel'), body = document.getElementById('panelBody');
  function select(id) {
    selected = id;
    var n = byId[id];
    body.innerHTML = '<h2>' + n.name + '</h2><div class="kind">' + n.type + '</div><dl>' +
      '<dt>What happens</dt><dd>' + n.what + '</dd>' +
      '<dt>Code</dt><dd><code>' + n.file + '</code></dd></dl>';
    panel.classList.add('open');
    highlight(id);
  }
  function closePanel() { selected = null; panel.classList.remove('open'); highlight(null); }
  panel.querySelector('.close').addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  // ---------------- Pan / zoom ----------------
  var svg = document.getElementById('svg'), stage = document.getElementById('stage');
  var view = { x: 0, y: 0, k: 1 };
  function apply() {
    world.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
    stage.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
    stage.style.backgroundSize = (20 * view.k) + 'px ' + (20 * view.k) + 'px';
  }
  function fit() {
    var bb = world.getBBox(), r = svg.getBoundingClientRect(), pad = 40, top = 56;
    var k = Math.min((r.width - pad * 2) / bb.width, (r.height - top - pad) / bb.height, 1.2);
    view.k = k;
    view.x = (r.width - bb.width * k) / 2 - bb.x * k;
    view.y = top + (r.height - top - bb.height * k) / 2 - bb.y * k;
    apply();
  }
  function zoomAt(f, cx, cy) {
    var nk = Math.max(0.15, Math.min(2.5, view.k * f));
    view.x = cx - (cx - view.x) * (nk / view.k);
    view.y = cy - (cy - view.y) * (nk / view.k);
    view.k = nk; apply();
  }
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = svg.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  var drag = null;
  svg.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.node')) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
    stage.classList.add('dragging'); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
  });
  svg.addEventListener('pointerup', function () {
    if (drag && !drag.moved) closePanel();
    drag = null; stage.classList.remove('dragging');
  });
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('zin').addEventListener('click', function () { var r = svg.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); });
  document.getElementById('zout').addEventListener('click', function () { var r = svg.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
  // Open readable from the trigger, like n8n after a small zoom-in; the fit button shows everything.
  function start() {
    fit();
    if (view.k >= 0.6) return;
    var bb = world.getBBox(), r = svg.getBoundingClientRect();
    view.k = 0.6;
    view.x = 24 - bb.x * view.k;
    view.y = 56 + Math.max(0, (r.height - 56 - bb.height * view.k) / 2) - bb.y * view.k;
    apply();
  }
  start();
})();
</script>
</body>
</html>
